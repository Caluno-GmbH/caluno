# Verify, build and push both images, plan Terraform, apply behind a GitHub
# Environment. Staging and production differ only by the inputs below. Callers
# serialize deploys with a workflow-level concurrency group.
#
# Gate, builds and plan all start at once; only `apply` waits on the gate.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy through, and the Terraform state prefix.
        type: string
        required: true
      moving-tag:
        description: Rolling image tag (`staging` / `latest`); the immutable tag is always the commit sha.
        type: string
        required: true
      api-url:
        description: Public API origin baked into the frontend bundle.
        type: string
        required: true
      web-url:
        description: Public web origin baked into the frontend bundle.
        type: string
        required: true
      notify-slack:
        description: Post to Slack after Terraform apply and (when run-e2e) after Playwright (release/production).
        type: boolean
        required: false
        default: false
      run-e2e:
        description: After a successful Terraform apply, run the Playwright suite against web-url / api-url.
        type: boolean
        required: false
        default: false
      mailbox-url:
        description: Mailpit web UI origin for run-e2e (required when run-e2e is true).
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  # Keep in sync with ci.yml.
  TF_VERSION: 1.15.9
  TF_ROOT: packages/infra
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  gate:
    name: Pre-deploy gate
    # Full suite. Runs alongside the image builds, and is what warms the
    # Turborepo cache on this branch for every pull request to read.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-verify.yml
    secrets: inherit

  build-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read # base images come from the ghcr.io/caluno-gmbh mirror
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: ./.github/actions/docker-auth
        with:
          scw-registry-host: ${{ vars.SCW_REGISTRY_HOST }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          # Scaleway Serverless Containers wants a plain single-platform
          # manifest, not an OCI index with an attestation.
          provenance: false
          tags: |
            ${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/caluno-backend:${{ github.sha }}
            ${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/caluno-backend:${{ inputs.moving-tag }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_BACKEND=${{ vars.SENTRY_PROJECT_BACKEND }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          # Per environment; pull requests read both.
          cache-from: type=registry,ref=${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/caluno-backend:buildcache-${{ inputs.environment }}
          cache-to: type=registry,ref=${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/caluno-backend:buildcache-${{ inputs.environment }},mode=max

  build-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: ./.github/actions/docker-auth
        with:
          scw-registry-host: ${{ vars.SCW_REGISTRY_HOST }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false # as above
          tags: |
            ${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/caluno-frontend:${{ github.sha }}
            ${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/caluno-frontend:${{ inputs.moving-tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.api-url }}
            NEXT_PUBLIC_WEB_URL=${{ inputs.web-url }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ inputs.environment }}
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_FRONTEND=${{ vars.SENTRY_PROJECT_FRONTEND }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=registry,ref=${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/caluno-frontend:buildcache-${{ inputs.environment }}
          cache-to: type=registry,ref=${{ vars.SCW_REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/caluno-frontend:buildcache-${{ inputs.environment }},mode=max

  plan:
    name: Terraform plan
    # No `needs`: `apply` is what waits on the gate and the images.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_active_environment: ${{ inputs.environment }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      SCW_DEFAULT_ZONE: ${{ vars.SCW_DEFAULT_ZONE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # Providers are ~100 MB and pinned by the lock file.
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('packages/infra/.terraform.lock.hcl') }}
          restore-keys: |
            tf-plugins-${{ runner.os }}-
      - name: Init & validate
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -backend-config="key=${{ inputs.environment }}/terraform.tfstate"
          terraform validate
      - name: Plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -o pipefail
          # -detailed-exitcode: 0 = no changes, 2 = changes, anything else fails.
          set +e
          terraform plan -detailed-exitcode -no-color \
            -var-file="terraform.tfvars" -out=plan.tfplan | tee plan.txt
          code=$?
          set -e
          case "$code" in
            0) echo "has-changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has-changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
      - name: Publish plan summary
        if: always() && steps.plan.outcome != 'skipped'
        working-directory: ${{ env.TF_ROOT }}
        run: |
          [ -f plan.txt ] || { echo "No plan output to summarize."; exit 0; }
          {
            echo "### Terraform plan — \`${{ inputs.environment }}\`"
            echo
            echo '```terraform'
            tail -c 900000 plan.txt # step summaries cap at 1 MiB
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: plan-${{ inputs.environment }}
          path: ${{ env.TF_ROOT }}/plan.tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terraform apply
    # Nothing reaches the environment unless the gate passed and both images
    # are in the registry.
    needs: [gate, plan, build-backend, build-frontend]
    # Skip on an empty plan, so no approval is requested for a no-op.
    if: needs.plan.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this environment are what make prod applies manual.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.web-url }}
    env:
      TF_VAR_active_environment: ${{ inputs.environment }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      SCW_DEFAULT_ZONE: ${{ vars.SCW_DEFAULT_ZONE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
          token: ${{ secrets.ORG_REPO_PAT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('packages/infra/.terraform.lock.hcl') }}
          restore-keys: |
            tf-plugins-${{ runner.os }}-
      - uses: actions/download-artifact@v8
        with:
          name: plan-${{ inputs.environment }}
          path: ${{ env.TF_ROOT }}
      # The saved plan file, so what was reviewed is what gets applied.
      - name: Apply the reviewed plan
        id: tf-apply
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init -backend-config="key=${{ inputs.environment }}/terraform.tfstate"
          terraform apply -auto-approve plan.tfplan
      # Terraform reports success even when the new backend revision never starts:
      # Scaleway keeps serving the previous one, so /health/ready still answers
      # 200. Only the revision's own `release` (the commit it was built from)
      # proves the new one is up. Failing here also keeps e2e and the Sentry
      # release from running against a deploy that did not happen.
      - name: Verify the new backend revision is serving
        id: verify
        env:
          READY_URL: ${{ inputs.api-url }}/health/ready
        run: |
          deadline=$((SECONDS + 420))
          while [ "$SECONDS" -lt "$deadline" ]; do
            release=$(curl -fsS -m 10 "$READY_URL" 2>/dev/null | jq -r '.release // empty' 2>/dev/null || true)
            if [ "$release" = "$GITHUB_SHA" ]; then
              echo "Backend is serving $release"
              exit 0
            fi
            echo "Serving: ${release:-nothing healthy}; waiting for $GITHUB_SHA"
            sleep 10
          done
          echo "::error::Backend never reported release $GITHUB_SHA on $READY_URL"
          exit 1
      # Says which PR failed to deploy. Posts to the environment's alert channel via
      # the environment-scoped SLACK_ALERT_WEBHOOK_URL; SLACK_WEBHOOK_URL stays
      # reserved for release management. continue-on-error: a dead webhook must not
      # hide the failed deploy, which already fails this job.
      - name: Notify Slack (backend not healthy)
        if: failure() && steps.verify.outcome == 'failure'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          ENVIRONMENT: ${{ inputs.environment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_ALERT_WEBHOOK_URL is not set for $ENVIRONMENT; failed deploy not reported to Slack"
            exit 0
          fi
          subject=$(printf '%s' "$COMMIT_MESSAGE" | head -n1)
          pr=$(printf '%s' "$subject" | grep -oE '#[0-9]+' | head -n1 | tr -d '#' || true)
          if [ -n "$pr" ]; then
            what="<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${pr}|PR #${pr}> (${subject})"
          else
            what="\`${GITHUB_SHA:0:8}\` (${subject})"
          fi
          text=":x: ${what} failed to deploy to *${ENVIRONMENT}*: the backend did not become healthy. The previous version is still serving. <${RUN_URL}|workflow run>"
          curl -fsS -X POST -H 'content-type: application/json' \
            --data "$(jq -n --arg text "$text" '{text: $text}')" "$SLACK_WEBHOOK_URL"
      # Release/production only (`notify-slack`). Fires after apply ran — not when
      # this job is skipped for an empty plan. Incoming webhook → #caluno-release-management.
      # continue-on-error: a dead webhook must not fail a successful apply.
      - name: Notify Slack
        if: >-
          always()
          && inputs.notify-slack
          && steps.verify.outcome != 'failure'
          && (steps.tf-apply.outcome == 'success' || steps.tf-apply.outcome == 'failure')
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ steps.tf-apply.outcome == 'success' && format(':rocket: {0} deployed', inputs.environment) || format(':x: {0} deploy failed', inputs.environment) }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "${{ steps.tf-apply.outcome == 'success' && format(':rocket: *{0}* deployed', inputs.environment) || format(':x: *{0}* deploy failed', inputs.environment) }}\n`${{ github.sha }}` · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run> · ${{ github.actor }}"

  sentry-release:
    name: Finalize Sentry release
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # bookkeeping must never fail a deploy
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # set-commits --auto needs full history
          filter: blob:none
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Associate commits and finalize the release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          RELEASE: ${{ github.sha }}
        run: |
          bunx @sentry/cli@2 releases --org "$SENTRY_ORG" set-commits "$RELEASE" --auto
          bunx @sentry/cli@2 releases --org "$SENTRY_ORG" finalize "$RELEASE"

  # Only after a real apply — skipped when the plan was empty. Failures fail
  # the deploy workflow so a bad release is visible on the branch.
  e2e:
    name: Playwright e2e
    needs: [apply]
    if: >-
      always()
      && inputs.run-e2e
      && needs.apply.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-e2e.yml
    with:
      app-url: ${{ inputs.web-url }}
      api-url: ${{ inputs.api-url }}
      mailbox-url: ${{ inputs.mailbox-url }}
      report-name: playwright-report-${{ inputs.environment }}
    secrets:
      MAILBOX_PASSWORD: ${{ secrets.MAILBOX_PASSWORD }}

  # Release/production only (`notify-slack` + `run-e2e`). Same webhook as the
  # apply notify → #caluno-release-management. continue-on-error: a dead
  # webhook must not mask the e2e outcome already reflected in needs.e2e.
  notify-e2e-slack:
    name: Notify Slack (e2e)
    needs: [e2e]
    if: >-
      always()
      && inputs.run-e2e
      && inputs.notify-slack
      && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ needs.e2e.result == 'success' && format(':white_check_mark: {0} e2e passed', inputs.environment) || format(':x: {0} e2e failed', inputs.environment) }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "${{ needs.e2e.result == 'success' && format(':white_check_mark: *{0}* e2e passed', inputs.environment) || format(':x: *{0}* e2e failed', inputs.environment) }}\n`${{ github.sha }}` · <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run> · ${{ github.actor }}"
