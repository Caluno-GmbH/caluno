# Full Playwright suite against the deployed staging app.
# Defaults in e2e/ already target staging; this job pins them and runs on a cron.
#
# Preconditions (manual, one-time / as needed):
# - Playground e2e accounts (`demo+e2e_*@caluno.org`) exist on staging with
#   password matching FIXTURE_PASSWORD (default `abcd1234`).
# - Repo secret `MAILBOX_PASSWORD` for staging Mailpit basic auth.
#
# Local-only specs (e.g. terms acceptance gate) stay skipped via IS_LOCAL.
name: Nightly e2e (staging)

on:
  schedule:
    # 00:00 UTC ≈ 02:00 Europe/Berlin in CEST (01:00 in CET).
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-staging-nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright against staging
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Restore e2e install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-e2e-${{ runner.os }}-${{ hashFiles('e2e/bun.lock') }}
          restore-keys: |
            bun-e2e-${{ runner.os }}-

      - name: Install e2e dependencies
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: e2e
        env:
          CI: true
          E2E_BASE_URL: https://staging.app.caluno.org
          E2E_API_URL: https://staging.api.caluno.org
          MAILBOX_URL: https://staging.mailbox.caluno.org
          MAILBOX_USER: mailpit
          MAILBOX_PASSWORD: ${{ secrets.MAILBOX_PASSWORD }}
        run: bun playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
