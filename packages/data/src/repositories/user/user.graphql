query GetMe {
  me {
    id
    name
    email
    image
    checkInId
    locale
    emailWeeklyUpdateEnabled
    emailUrgentCallsEnabled
    emailPlatformEnabled
    firstname
    lastname
    preferredName
    gender
    phone
    street
    zip
    city
    birthdate
    iban
    accountHolder
    bic
  }
}

query GetUser($id: String!) {
  user(id: $id) {
    id
    name
    email
    image
    checkInId
    locale
    firstname
    lastname
    preferredName
    gender
    phone
    street
    zip
    city
    birthdate
    iban
    accountHolder
    bic
  }
}

query GetUserByCheckInId($checkInId: String!) {
  userByCheckInId(checkInId: $checkInId) {
    id
    name
    email
    image
    checkInId
    locale
  }
}

query GetMyPermissions {
  me {
    id
    permissions {
      id
      key
    }
  }
}

query GetMyOrganizations($limit: Int!, $offset: Int!) {
  organizations(limit: $limit, offset: $offset) {
    items {
      id
      name
      slug
      description
      logoUrl
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

mutation UpdateMyLocale($locale: String!) {
  updateMyLocale(locale: $locale) {
    id
    locale
  }
}

mutation UpdateMyImage($input: UpdateMyImageInput!) {
  updateMyImage(input: $input) {
    id
    image
  }
}

mutation UpdateMyAccountSettings($input: UpdateMyAccountSettingsInput!) {
  updateMyAccountSettings(input: $input) {
    id
    locale
    emailWeeklyUpdateEnabled
    emailUrgentCallsEnabled
    emailPlatformEnabled
  }
}

mutation UpdateMyProfile($input: UpdateMyProfileInput!) {
  updateMyProfile(input: $input) {
    id
    firstname
    lastname
    preferredName
    gender
    phone
    street
    zip
    city
    birthdate
    iban
    accountHolder
    bic
    email
  }
}
