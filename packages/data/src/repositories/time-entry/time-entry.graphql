mutation AddTimeEntry($input: AddTimeEntryInput!) {
  addTimeEntry(input: $input) {
    id
  }
}

mutation DeleteTimeEntry($id: ID!) {
  deleteTimeEntry(id: $id) {
    id
  }
}

mutation CloseTimeEntry($id: ID!, $input: CloseTimeEntryInput!) {
  closeTimeEntry(id: $id, input: $input) {
    id
  }
}

mutation ConfirmTimeEntry($id: ID!) {
  confirmTimeEntry(id: $id) {
    id
  }
}

query GetTimeEntry($id: String!) {
  timeEntry(id: $id) {
    id
    status
    startedAt
    endedAt
    notes
    createdAt
    createdBy {
      id
      name
      email
    }
    isPaid
    reimbursementType {
      id
      key
    }
    volunteer {
      id
      name
      email
    }
    shiftInstance {
      id
      actualStartsAt
      actualEndsAt
      overrideTitle
      master {
        id
        title
      }
    }
    organizationUnit {
      id
      name
      organization {
        id
        name
      }
    }
  }
}

mutation UpdateTimeEntry($id: ID!, $input: UpdateTimeEntryInput!) {
  updateTimeEntry(id: $id, input: $input) {
    id
  }
}

query GetTimeEntries(
  $limit: Int!
  $offset: Int!
  $sort: TimeEntrySortField
  $order: SortOrder
  $statuses: [TimeEntryStatus!]
  $volunteerId: ID
  $shiftId: ID
  $dateFrom: DateTime
  $dateTo: DateTime
) {
  timeEntries(
    limit: $limit
    offset: $offset
    sort: $sort
    order: $order
    statuses: $statuses
    volunteerId: $volunteerId
    shiftId: $shiftId
    dateFrom: $dateFrom
    dateTo: $dateTo
  ) {
    items {
      id
      status
      startedAt
      endedAt
      createdAt
      createdBy {
        id
        name
        email
      }
      volunteer {
        id
        name
        email
      }
      notes
      shiftInstance {
        id
        actualStartsAt
        actualEndsAt
        overrideTitle
        overrideLocation
        master {
          id
          title
          location
        }
      }
      organizationUnit {
        id
        name
        street
        zipCode
        city
        organization {
          id
          name
        }
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetTimeEntriesByUser($userId: String!, $limit: Int!, $offset: Int!) {
  timeEntriesByUser(userId: $userId, limit: $limit, offset: $offset) {
    items {
      id
      status
      startedAt
      endedAt
      shiftInstance {
        id
        actualStartsAt
        actualEndsAt
        overrideTitle
        master {
          id
          title
        }
      }
      organizationUnit {
        id
        name
        organization {
          id
          name
        }
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetMyTime($limit: Int!, $offset: Int!) {
  myTime(limit: $limit, offset: $offset) {
    items {
      id
      status
      startedAt
      endedAt
      shiftInstance {
        id
        overrideTitle
        master {
          id
          title
          organizationUnit {
            id
            name
            organization {
              id
              name
            }
          }
        }
      }
      organizationUnit {
        id
        name
        organization {
          id
          name
        }
      }
    }
    pagination {
      total
      limit
      offset
      hasMore
    }
  }
}

query GetCheckInContext($checkInId: String!) {
  checkInContext(checkInId: $checkInId) {
    volunteer {
      id
      name
      image
    }
    eligibleOrganizationUnits {
      id
      name
    }
    pendingOrganizationUnits {
      id
      name
    }
    openTimeEntries {
      id
      startedAt
      shiftInstance {
        id
        actualStartsAt
        actualEndsAt
        overrideTitle
        master {
          id
          title
        }
      }
      organizationUnit {
        id
        name
        organization {
          id
          name
        }
      }
    }
  }
}

query GetCheckInReadiness($checkInId: String!, $shiftInstanceId: ID) {
  checkInReadiness(checkInId: $checkInId, shiftInstanceId: $shiftInstanceId) {
    isMember
    membershipRequest {
      id
      canAccept
      organizationUnitName
    }
    shiftInviteStatus
    isParticipating
    hasOpenTimeEntry
    idVerificationEnabled
    idVerified
    membershipId
    canViewVolunteerProfile
    shiftHasAvailableSeat
    agreement {
      status
      reimbursementTypeName
      contractId
      canManageAgreements
      managerNames
    }
  }
}

query GetCheckInVolunteerRequiredForms($checkInId: String!) {
  checkInVolunteerRequiredForms(checkInId: $checkInId) {
    form {
      id
      name
    }
    order
    submitted
    submissionId
  }
}

mutation CheckInVolunteer(
  $volunteerId: ID!
  $shiftInstanceId: ID
  $startedAt: DateTime
) {
  checkInVolunteer(
    volunteerId: $volunteerId
    shiftInstanceId: $shiftInstanceId
    startedAt: $startedAt
  ) {
    id
  }
}

mutation CheckInInviteToOrganization($checkInId: String!) {
  checkInInviteToOrganization(checkInId: $checkInId)
}

mutation CheckOutVolunteer($timeEntryId: ID!) {
  checkOutVolunteer(timeEntryId: $timeEntryId) {
    id
  }
}
