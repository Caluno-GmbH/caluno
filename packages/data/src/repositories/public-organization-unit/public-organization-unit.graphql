fragment PublicOrganizationUnitFields on OrganizationUnit {
  id
  name
  slug
  description
  logoUrl
  coverUrl
  street
  zipCode
  city
  memberCount
  openShiftsCount
  myMembershipState
}

fragment PublicOrgEventFields on Event {
  id
  title
  slug
  startsAt
  endsAt
  location
  shiftsCount
  shifts {
    id
    instances {
      id
      spotsLeft
    }
  }
}

fragment PublicOrgShiftInstanceFields on ShiftInstance {
  id
  actualStartsAt
  actualEndsAt
  overrideMaxVolunteers
  filledCount
  spotsLeft
}

fragment PublicOrgShiftFields on Shift {
  id
  title
  maxVolunteers
  rrule
  originalStartsAt
  durationMinutes
  instances {
    ...PublicOrgShiftInstanceFields
  }
}

fragment PublicOrganizationUnitRequiredForms on OrganizationUnit {
  requiredForms {
    form {
      id
      name
      description
      blockRefs {
        id
        formId
        blockId
        fieldOrder
        block {
          id
          organizationId
          title
          description
          icon
          isEditable
          fields {
            id
            blockId
            type
            label
            placeholder
            description
            required
            lockType
            profileKey
            options
            documents {
              fileId
              filename
              downloadUrl
            }
            documentLabel
            minAge
            fieldOrder
          }
        }
      }
    }
    order
  }
}

query GetPublicOrganizationUnit($id: ID!) {
  publicOrganizationUnit(id: $id) {
    ...PublicOrganizationUnitFields
  }
}

query GetPublicOrganizationUnitWithRequiredForms($id: ID!) {
  publicOrganizationUnit(id: $id) {
    ...PublicOrganizationUnitFields
    ...PublicOrganizationUnitRequiredForms
  }
}

query GetPublicEventsByOrganizationUnit($organizationUnitId: ID!) {
  publicEventsByOrganizationUnit(organizationUnitId: $organizationUnitId) {
    ...PublicOrgEventFields
  }
}

query GetPublicShiftsByOrganizationUnit($organizationUnitId: ID!) {
  publicShiftsByOrganizationUnit(organizationUnitId: $organizationUnitId) {
    ...PublicOrgShiftFields
  }
}
