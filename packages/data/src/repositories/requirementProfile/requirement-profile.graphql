query GetAdminUserProfile($userId: String!) {
  user(id: $userId) {
    id
    email
    firstname
    lastname
    preferredName
    gender
    phone
    street
    zip
    city
    birthdate
    iban
    accountHolder
    bic
  }
}

mutation CreateRequirementProfileSubmission(
  $input: CreateRequirementProfileSubmissionInput!
) {
  createRequirementProfileSubmission(input: $input) {
    id
    status
    requirementProfile {
      id
      name
    }
  }
}
