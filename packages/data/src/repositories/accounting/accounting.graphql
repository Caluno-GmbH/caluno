fragment ContractSummaryFields on Contract {
  id
  contractStatus
  periodStart
  periodEnd
  isNonCompliant
  declineReason
  declinedAt
  declinedAtSigneeType
  declinedByUser {
    id
    name
  }
  renewDate
  downloadUrl
  missingProfileFields
  missingOrgProfileFields
  createdAt
  updatedAt
  volunteer {
    id
    name
    image
  }
  reimbursementTypeKey
  documentTemplate {
    id
    kind
  }
  signatures {
    id
    order
    signeeType
    signedAt
    signedByName
    signedByUser {
      id
      name
    }
    requiredPermission {
      id
      key
    }
  }
  statusChanges {
    id
    type
    occurredAt
    actorUser {
      id
      name
    }
  }
}

query GetContracts($filter: ContractFilterInput) {
  contracts(filter: $filter) {
    ...ContractSummaryFields
  }
}

query GetMyContracts($filter: ContractFilterInput) {
  myContracts(filter: $filter) {
    ...ContractSummaryFields
  }
}

query GetContract($id: ID!) {
  contract(id: $id) {
    ...ContractSummaryFields
    resolvedBody
  }
}

query GetPendingContractSignee($contractId: ID!) {
  pendingContractSignee(contractId: $contractId) {
    signeeType
    userId
    permissionKey
    eligibleUserIds
  }
}

mutation CreateContract($input: CreateContractInput!) {
  createContract(input: $input) {
    ...ContractSummaryFields
  }
}

mutation SignContract($contractId: ID!) {
  signContract(contractId: $contractId) {
    ...ContractSummaryFields
  }
}

mutation DeclineContract($contractId: ID!, $reason: String!) {
  declineContract(contractId: $contractId, reason: $reason) {
    ...ContractSummaryFields
  }
}

fragment InvoiceSummaryFields on Invoice {
  id
  invoiceStatus
  periodStart
  periodEnd
  totalAmountCents
  totalHours
  isNonCompliant
  # Live (does a claimed hour lack an ACTIVE contract right now?), unlike the
  # stored isNonCompliant above, which is only the state at creation.
  hasHoursWithoutActiveContract
  declineReason
  declinedAt
  declinedAtSigneeType
  declinedByUser {
    id
    name
  }
  downloadUrl
  missingProfileFields
  missingOrgProfileFields
  createdAt
  updatedAt
  volunteer {
    id
    name
    image
  }
  reimbursementTypeKey
  documentTemplate {
    id
    kind
  }
  # Shift count for a timesheet card ("3 Shifts · 10 hours · 234 €").
  invoiceTimeEntries {
    id
  }
  signatures {
    id
    order
    signeeType
    signedAt
    signedByName
    signedByUser {
      id
      name
    }
    requiredPermission {
      id
      key
    }
  }
  statusChanges {
    id
    type
    occurredAt
    actorUser {
      id
      name
    }
  }
}

query GetInvoices($filter: InvoiceFilterInput) {
  invoices(filter: $filter) {
    ...InvoiceSummaryFields
    # Admin board only: how it reached accounting is not volunteer-facing.
    # lastEmailDelivery drives the "still sending" poll; lastDelivery drives
    # the per-row sent/downloaded status.
    lastEmailDelivery {
      occurredAt
      status
      deliveredByUser {
        id
        name
      }
    }
    lastDelivery {
      method
      occurredAt
      deliveredByUser {
        name
      }
      status
    }
  }
}

query GetMyInvoices($filter: InvoiceFilterInput) {
  myInvoices(filter: $filter) {
    ...InvoiceSummaryFields
  }
}

query GetInvoice($id: ID!) {
  invoice(id: $id) {
    ...InvoiceSummaryFields
    resolvedBody
    deliveries {
      id
      method
      occurredAt
      # PENDING/SENDING is not "sent"; FAILED never arrived.
      status
      deliveredByUser {
        name
      }
    }
    invoiceTimeEntries {
      id
      timeEntry {
        id
        startedAt
        endedAt
        notes
        shiftInstance {
          id
          overrideTitle
          master {
            title
          }
        }
      }
    }
  }
}

query GetPendingInvoiceSignee($invoiceId: ID!) {
  pendingInvoiceSignee(invoiceId: $invoiceId) {
    signeeType
