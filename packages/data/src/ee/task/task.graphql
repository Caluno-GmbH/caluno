query MyTasks {
  myTasks {
    id
    type
    link
    data
    organizationUnitId
    neededPermission
  }
}

query TodoFillAssignmentFilter {
  todoFillAssignmentFilter {
    threshold
    daysAhead
  }
}

mutation UpdateTodoFillAssignmentFilter(
  $input: UpdateTodoFillAssignmentFilterInput!
) {
  updateTodoFillAssignmentFilter(input: $input) {
    threshold
    daysAhead
  }
}
